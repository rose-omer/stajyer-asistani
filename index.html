<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Staj başvurusu için şirket bul, taslak yaz, onayınla gönder."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1524" media="(prefers-color-scheme: dark)" />
    <title>Stajyer Asistanı</title>
    <script>
      // Tema tercihini ilk boyamadan önce uygula (yanıp sönmeyi önler).
      try {
        var t = localStorage.getItem('stajyer_theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
